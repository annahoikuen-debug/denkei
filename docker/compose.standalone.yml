name: denkei-smb-standalone

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required. Configure it in .env.}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required. Configure it in .env.}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required. Configure it in .env.}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-denkei} -d ${POSTGRES_DB:-denkei}']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - denkei_data:/var/lib/postgresql/data

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PORT=3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required. Configure it in .env.}
      - NEXT_PRIVATE_ENCRYPTION_KEY=${NEXT_PRIVATE_ENCRYPTION_KEY:?NEXT_PRIVATE_ENCRYPTION_KEY is required. Configure it in .env.}
      - NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY=${NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY:?NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY is required. Configure it in .env.}
      - NEXT_PUBLIC_WEBAPP_URL=${NEXT_PUBLIC_WEBAPP_URL:-http://localhost:3000}
      - NEXT_PRIVATE_INTERNAL_WEBAPP_URL=http://localhost:3000
      - NEXT_PRIVATE_DATABASE_URL=postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      - NEXT_PRIVATE_DIRECT_DATABASE_URL=postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      # === デンケイ 中小企業特化・低コスト構成（SMB Standalone Lean Profile） ===
      - NEXT_PRIVATE_JOBS_PROVIDER=local
      - NEXT_PRIVATE_SIGNING_ENABLE_TSA=false
      - NEXT_PRIVATE_IDENTITY_PROVIDER=otp
      - NEXT_PRIVATE_SIGNING_TRANSPORT=local
      - NEXT_PUBLIC_UPLOAD_TRANSPORT=${NEXT_PUBLIC_UPLOAD_TRANSPORT:-database}
      # テレメトリ無効化（第三者送信ゼロ、SMB Lean Profile 既定）
      - DOCUMENSO_DISABLE_TELEMETRY=true
      # 完了文書の保管期限（日）。0=無効。30〜90を推奨。詳細は docs/plans/recommended-minimal-risk-implementation-plan.md
      - NEXT_PRIVATE_ENVELOPE_RETENTION_DAYS=${NEXT_PRIVATE_ENVELOPE_RETENTION_DAYS:-0}
      # メール配信設定 (SMTP / Resend / SES)
      - NEXT_PRIVATE_SMTP_TRANSPORT=${NEXT_PRIVATE_SMTP_TRANSPORT:-smtp-auth}
      - NEXT_PRIVATE_SMTP_HOST=${NEXT_PRIVATE_SMTP_HOST}
      - NEXT_PRIVATE_SMTP_PORT=${NEXT_PRIVATE_SMTP_PORT:-587}
      - NEXT_PRIVATE_SMTP_USERNAME=${NEXT_PRIVATE_SMTP_USERNAME}
      - NEXT_PRIVATE_SMTP_PASSWORD=${NEXT_PRIVATE_SMTP_PASSWORD}
      - NEXT_PRIVATE_SMTP_FROM_NAME=${NEXT_PRIVATE_SMTP_FROM_NAME:-デンケイ 電子契約}
      - NEXT_PRIVATE_SMTP_FROM_ADDRESS=${NEXT_PRIVATE_SMTP_FROM_ADDRESS:-noreply@denkei.local}
      - NEXT_PRIVATE_RESEND_API_KEY=${NEXT_PRIVATE_RESEND_API_KEY}
      - NEXT_PUBLIC_DOCUMENT_SIZE_UPLOAD_LIMIT=${NEXT_PUBLIC_DOCUMENT_SIZE_UPLOAD_LIMIT:-10}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"

volumes:
  denkei_data:
